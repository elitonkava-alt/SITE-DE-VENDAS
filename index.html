<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Jogos — GameVerse</title>
  
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>
  <div class="site">
    <header>
      <div class="brand">
        <div class="logo">GV</div>
        <h1>GameVerse</h1>
      </div>

    <main>
      <section class="catalog">

          <li id="empty-cart-message">O carrinho está vazio.</li>
        </ul>
        <div class="cart-total">
          <span>Total:</span>
          <span id="cart-total-value">R$ 0,00</span>

        <button class="btn-checkout" onclick="alert('Funcionalidade de Checkout: Implementar lógica de pagamento aqui!')">Finalizar Compra</button>
      </aside>

    <footer>

    </footer>

  <script src="script.js"></script>
